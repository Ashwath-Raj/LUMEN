# AI evaluation golden set — LUMEN_MASTER_SPEC_V3 §17.1.
#
# 40-60 questions, each with: question, expected_intent, expected_entity_ids,
# rubric (acceptable-answer keywords), category. Seven §17.1 categories:
# case_lookup, person_history, district_comparison, legal, network, forecast,
# and unanswerable ("the data does not support this").
#
# expected_entity_ids reference the deterministic §32 seed (jobs/seed.py) via
# the ID forms the AI retriever actually surfaces:
#   case         -> "<CaseMasterID>"          (e.g. "1000")
#   KB legal     -> "section:IPC:302" / "act:IPC" / "crime_taxonomy:<id>"
#   KB case      -> "case_brief:<CaseMasterID>"
# Person UUIDs (lumen_person) are resolution-derived; person_history questions
# assert intent + a rubric rather than a volatile UUID, so the golden set
# stays valid across resolution re-runs (the person node id is not a stable
# public identifier — P10). Unanswerable rows carry no expected ids.

questions:
  # ── case_lookup ──────────────────────────────────────────────────────────
  - id: case_lookup_1000
    category: case_lookup
    question: "Tell me about case 1000."
    expected_intent: case
    expected_entity_ids: ["1000"]
    rubric: ["case", "1000"]
  - id: case_lookup_5000
    category: case_lookup
    question: "What are the brief facts of case 5000?"
    expected_intent: case
    expected_entity_ids: ["5000"]
    rubric: ["case", "5000"]
  - id: case_lookup_4000
    category: case_lookup
    question: "Show the FIR details for case 4000."
    expected_intent: case
    expected_entity_ids: ["4000"]
    rubric: ["case", "4000"]
  - id: case_lookup_8000
    category: case_lookup
    question: "Give me the record for case 8000."
    expected_intent: case
    expected_entity_ids: ["8000"]
    rubric: ["case", "8000"]
  - id: case_lookup_1001
    category: case_lookup
    question: "Details of case 1001 please."
    expected_intent: case
    expected_entity_ids: ["1001"]
    rubric: ["case", "1001"]
  - id: case_lookup_1002
    category: case_lookup
    question: "What happened in case 1002?"
    expected_intent: case
    expected_entity_ids: ["1002"]
    rubric: ["case", "1002"]
  - id: case_lookup_4001
    category: case_lookup
    question: "Summarise case 4001."
    expected_intent: case
    expected_entity_ids: ["4001"]
    rubric: ["case", "4001"]
  - id: case_lookup_1003
    category: case_lookup
    question: "Show me case 1003."
    expected_intent: case
    expected_entity_ids: ["1003"]
    rubric: ["case", "1003"]

  # ── person_history ───────────────────────────────────────────────────────
