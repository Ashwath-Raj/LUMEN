<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs><text x="72" y="48" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#4B4B4B" text-anchor="start" letter-spacing="1.5" style="">KSP DATATHON 2026  /  LUMEN</text><text x="72" y="116" font-family="Inter,Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#111111" text-anchor="start" style="">EVIDENCE-GROUNDED AI &amp; TRUST CONTROLS</text><text x="74" y="158" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">A constrained decision-support pipeline: retrieve first, generate second, verify before presenting.</text><path d="M72,190 L1728,190" fill="none" stroke="#111111" stroke-width="2"/><text x="72" y="1150" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#4B4B4B" text-anchor="start" style="">04  /  05</text><text x="1728" y="1150" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#4B4B4B" text-anchor="end" style="">LUMEN  •  ARCHITECTURE SERIES</text><path d="M72,1120 L1728,1120" fill="none" stroke="#B8B8B8" stroke-width="1"/><text x="90" y="245" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1" style="">AI ASSISTANT REQUEST PATH</text><text x="90" y="270" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">The model does not receive unrestricted database access</text><rect x="90" y="310" width="180" height="175" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><text x="180" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Question</text><text x="180" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Analyst asks a case</text><text x="180" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">or pattern question</text><path d="M270,395 L285,395" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="310" width="180" height="175" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><text x="385" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Intent &amp; entities</text><text x="385" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Classify intent;</text><text x="385" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">resolve references</text><path d="M475,395 L490,395" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="310" width="180" height="175" rx="8" fill="#F4F4F4" stroke="#111111" stroke-width="1.7"/><text x="590" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Policy scope</text><text x="590" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Check role and</text><text x="590" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">jurisdiction access</text><path d="M680,395 L695,395" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="705" y="310" width="180" height="175" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><text x="795" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Evidence retrieval</text><text x="795" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Fetch allowed cases,</text><text x="795" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">graph and legal sources</text><path d="M885,395 L900,395" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="910" y="310" width="180" height="175" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><text x="1000" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Evidence bundle</text><text x="1000" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Cited context +</text><text x="1000" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">source identifiers</text><path d="M1090,395 L1105,395" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="310" width="180" height="175" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><text x="1205" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Generation</text><text x="1205" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Provider response or</text><text x="1205" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">local fallback</text><path d="M1295,395 L1310,395" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="1320" y="310" width="180" height="175" rx="8" fill="#F4F4F4" stroke="#111111" stroke-width="1.7"/><text x="1410" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Verification</text><text x="1410" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Validate schema;</text><text x="1410" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">filter unsupported IDs</text><path d="M1500,395 L1515,395" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="1525" y="310" width="180" height="175" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><text x="1615" y="350" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">Answer &amp; review</text><text x="1615" y="390" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">Cited answer + limits;</text><text x="1615" y="412" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#4B4B4B" text-anchor="middle" style="">human review</text><rect x="90" y="555" width="780" height="200" rx="10" fill="#FAFAFA" stroke="#111111" stroke-width="2"/><text x="120" y="600" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111111" text-anchor="start" style="">GUARDRAIL 01  /  EVIDENCE INTEGRITY</text><text x="120" y="640" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">The response is checked against the retrieved evidence bundle.</text><text x="120" y="671" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Entity IDs not present in that bundle are discarded.</text><text x="120" y="702" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Legal and case corpora remain separately classified.</text><rect x="930" y="555" width="780" height="200" rx="10" fill="#FAFAFA" stroke="#111111" stroke-width="2"/><text x="960" y="600" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111111" text-anchor="start" style="">GUARDRAIL 02  /  RESPONSIBLE USE</text><text x="960" y="640" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Protected attributes are excluded from analytical inputs.</text><text x="960" y="671" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">No individual criminality prediction or automated enforcement.</text><text x="960" y="702" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Every insight should expose factors, confidence and limitations.</text><text x="90" y="820" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1" style="">TRUST IS CROSS-CUTTING</text><text x="90" y="845" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Controls apply across ingestion, retrieval, generation and review</text><rect x="90" y="865" width="380" height="115" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="108" y="899" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" style="">Identity &amp; access</text><text x="108" y="931" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Role / jurisdiction scope</text><rect x="500" y="865" width="380" height="115" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="518" y="899" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" style="">Data governance</text><text x="518" y="931" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Classification / masking / retention</text><rect x="910" y="865" width="380" height="115" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="928" y="899" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" style="">Audit &amp; lineage</text><text x="928" y="931" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Actor / source / model / method</text><rect x="1320" y="865" width="380" height="115" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="1338" y="899" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" style="">Resilience</text><text x="1338" y="931" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Visible fallback / degraded mode</text><text x="900" y="1055" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#111111" text-anchor="middle" style="">AI output is investigative assistance—not a finding of guilt, a substitute for evidence, or an autonomous operational decision.</text></svg>