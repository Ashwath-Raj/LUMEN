ze="16" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Cited answer • limits</text><text x="1483" y="801" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">review &amp; audit</text><rect x="90" y="900" width="1620" height="120" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="108" y="934" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#111111" text-anchor="start" style="">CONTROL POINTS THROUGHOUT THE FLOW</text><text x="108" y="966" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Evidence is retrieved before generation  •  unsupported entity IDs are removed  •  confidence and limitations travel with insights</text><text x="108" y="991" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Sensitive attributes are excluded from analytical use  •  model output supports human review, never automated enforcement</text><text x="900" y="1068" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="500" fill="#4B4B4B" text-anchor="middle" style="">Batch outputs improve consistency and response time; the request path consumes prepared evidence rather than rebuilding everything on demand.</text></svg>