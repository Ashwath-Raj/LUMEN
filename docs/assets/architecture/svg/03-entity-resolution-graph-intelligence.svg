<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="#FFFFFF"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#111111"/></marker><marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker></defs><text x="72" y="48" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#4B4B4B" text-anchor="start" letter-spacing="1.5" style="">KSP DATATHON 2026  /  LUMEN</text><text x="72" y="116" font-family="Inter,Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#111111" text-anchor="start" style="">ENTITY RESOLUTION &amp; GRAPH INTELLIGENCE</text><text x="74" y="158" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Treat identity as an evidence-backed inference—not a name match presented as fact.</text><path d="M72,190 L1728,190" fill="none" stroke="#111111" stroke-width="2"/><text x="72" y="1150" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#4B4B4B" text-anchor="start" style="">03  /  05</text><text x="1728" y="1150" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#4B4B4B" text-anchor="end" style="">LUMEN  •  ARCHITECTURE SERIES</text><path d="M72,1120 L1728,1120" fill="none" stroke="#B8B8B8" stroke-width="1"/><text x="90" y="245" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1" style="">WHY RESOLUTION IS NEEDED</text><text x="90" y="270" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Accused is case-scoped—not a global person record.</text><rect x="90" y="285" width="430" height="120" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="108" y="319" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Case A  /  Accused row</text><text x="108" y="351" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Case-scoped record</text><text x="108" y="376" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Source attributes + provenance</text><rect x="90" y="450" width="430" height="120" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="108" y="484" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Case B  /  Accused row</text><text x="108" y="516" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">A separate case-scoped record</text><text x="108" y="541" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">May refer to the same person</text><rect x="90" y="615" width="430" height="120" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="108" y="649" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Case C  /  Accused row</text><text x="108" y="681" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Another independent record</text><text x="108" y="706" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">No assumed identity link</text><text x="305" y="780" font-family="Inter,Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#4B4B4B" text-anchor="middle" style="">Independent source records</text><text x="620" y="245" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1" style="">MATCHING PIPELINE</text><text x="620" y="270" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Candidate generation → score → threshold</text><rect x="625" y="290" width="510" height="105" rx="9" fill="#FAFAFA" stroke="#111111" stroke-width="2"/><text x="643" y="324" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Normalize</text><text x="643" y="356" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Name and phonetic</text><text x="643" y="381" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">normalization</text><path d="M880,395 L880,427" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="435" width="510" height="105" rx="9" fill="#FAFAFA" stroke="#111111" stroke-width="2"/><text x="643" y="469" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Block</text><text x="643" y="501" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Reduce comparisons</text><text x="643" y="526" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">to plausible pairs</text><path d="M880,540 L880,572" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="580" width="510" height="105" rx="9" fill="#FAFAFA" stroke="#111111" stroke-width="2"/><text x="643" y="614" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Score</text><text x="643" y="646" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Weighted signals</text><text x="643" y="671" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">and common-name penalty</text><path d="M880,685 L880,717" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="625" y="725" width="510" height="105" rx="9" fill="#FAFAFA" stroke="#111111" stroke-width="2"/><text x="643" y="759" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Threshold</text><text x="643" y="791" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Link / candidate /</text><text x="643" y="816" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">reject</text><path d="M520 345 L585 345 L585 340 L615 340" fill="none" stroke="#4B4B4B" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 510 L585 510 L585 480 L615 480" fill="none" stroke="#4B4B4B" stroke-width="2" marker-end="url(#arrow)"/><path d="M520 675 L585 675 L585 630 L615 630" fill="none" stroke="#4B4B4B" stroke-width="2" marker-end="url(#arrow)"/><text x="1230" y="245" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1" style="">CONFIDENCE &amp; GRAPH OUTPUT</text><text x="1230" y="270" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Thresholds from the repository identity pipeline</text><rect x="1230" y="285" width="480" height="105" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="1248" y="319" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">≥ 0.85  /  Auto-link</text><text x="1248" y="351" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">High-confidence inferred link</text><rect x="1230" y="415" width="480" height="105" rx="9" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="1248" y="449" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">0.65–0.85  /  Candidate</text><text x="1248" y="481" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Surface for review; do not auto-merge</text><rect x="1230" y="545" width="480" height="105" rx="9" fill="#FAFAFA" stroke="#111111" stroke-width="2"/><text x="1248" y="579" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">&lt; 0.65  /  Reject</text><text x="1248" y="611" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Do not create an identity link</text><path d="M1135,772 L1210,772" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><rect x="1230" y="710" width="480" height="115" rx="9" fill="#F4F4F4" stroke="#111111" stroke-width="2"/><text x="1248" y="744" font-family="Inter,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start" style="">Persist resolved entities</text><text x="1248" y="776" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">lumen_person  •  lumen_person_link</text><text x="1248" y="801" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Per-link confidence and match features</text><text x="90" y="850" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="1" style="">RELATIONSHIP GRAPH</text><text x="90" y="875" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#4B4B4B" text-anchor="start" style="">Solid lines: source-backed relation  /  Dashed lines: inferred or derived relation</text><rect x="140" y="940" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="220" y="977" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">PERSON P1</text><rect x="395" y="890" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="475" y="927" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">CASE A</text><rect x="395" y="1010" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="475" y="1047" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">CASE B</text><rect x="640" y="940" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="720" y="977" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">PERSON P2</text><rect x="895" y="890" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="975" y="927" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">CASE C</text><rect x="895" y="1010" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="975" y="1047" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="middle" style="">STATION S1</text><path d="M300,970 L395,930" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><path d="M300,970 L395,1030" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><path d="M555,920 L640,970" fill="none" stroke="#4B4B4B" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M555,1040 L640,970" fill="none" stroke="#4B4B4B" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M800,970 L895,930" fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)"/><path d="M800,970 L895,1040" fill="none" stroke="#4B4B4B" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="90" y="1090" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" font-weight="500" fill="#4B4B4B" text-anchor="start" style="">A relationship graph can expose co-accused links, shared case signatures, proximity and organizational connections—subject to source quality and review.</text></svg>